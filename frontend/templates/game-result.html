<!DOCTYPE html>
<html>
<head>
    <title>Game Result</title>
</head>
<body>
    <h1 align="center">Game Result</h1>
    <h3 align="right">Player: {{game.player.name}}</h3>
    <form action="/" method="GET" align="right">
        <button type="submit">Home</button>
    </form>
    <p>Game session completed. </p>
    <p>Total score: {{game.total_score}}
    Rounds played: {{game.rounds|length}}
    </p>
    <ul>
    {% for round in game.rounds %}
        <li>
            Round {{ round.number }}:
            {{ round.score }}
            points -
            {{ round.distance }}
            meters
        </li>    
    {% endfor %}
    </ul>
</body>
</html>
