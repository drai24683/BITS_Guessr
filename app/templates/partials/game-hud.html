<div class="game-hud">

    <div class="hud-section">

        <span class="hud-label">
            Total
        </span>

        <span class="hud-value">
            {{ game.total_score }}
        </span>

    </div>

    <div class="hud-section">

        {% if show_result_stats %}

        <span class="hud-label">
            Score
        </span>

        <span class="hud-value">
            +{{ game.current_round.score }}
        </span>

        {% endif %}

    </div>

    <div class="hud-section">

        <span class="hud-label">
            Round
        </span>

        <span class="hud-value">
            {{ game.current_round.number }}/{{ game.MAX_ROUNDS }}
        </span>

    </div>

    <div class="hud-section">

        {% if show_result_stats %}

        <span class="hud-label">
            Distance
        </span>

        <span class="hud-value">
            {{ game.current_round.distance }} m
        </span>

        {% endif %}

    </div>

    <div class="hud-section">

        <form
            id="homeForm"
            {% if game.user_id %}
                action="/home"
            {% else %}
                action="/"
            {% endif %}
            method="GET"
        >

            <button
                class="hud-button"
                type="submit">

                {{ game.display_name }} 🦆

            </button>

        </form>

    </div>

</div>
