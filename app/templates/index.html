{% extends "base.html" %}

{% block title %}
Home
{% endblock %}

{% block head %}

<link rel="stylesheet" href="/static/css/index.css">

{% endblock %}

{% block content %}

<div class="homeCard">

    <h2>Welcome to BITSGuessr</h2>

    <p>
        Explore the BITS Goa campus one location at a time.
    </p>

    <form action="/start_game" method="POST">

        <label for="player_name" class="enterName">
            New Number, Who Dis?
        </label>

        <input
            id="player_name"
            type="text"
            name="player_name"
            placeholder="Player Name"
            required
        >

        <button id="startBtn" type="submit" autofocus>
            Start Game
        </button>
    </form>

    <div class="signature">
        ~made by Duck
    </div>

</div>


<script src="/static/js/index.js"></script>

{% endblock %}
